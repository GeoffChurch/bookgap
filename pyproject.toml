[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bookgap"
version = "0.1"
description = "Finding the next textbook to write"
requires-python = ">=3.11"
dependencies = [
    "accelerate",
    "adalflow",
    "bitsandbytes",
    "boto3",
    "faiss-cpu",
    "orjson",
    "pysimdjson",
    "graphviz", # for adalflow
    "hydra-core",
    "omegaconf",
    "leidenalg", # unused since the legacy curriculum pipeline's Leiden clustering was deleted (Phase-3 Task 10); the engine's port (curriculum.layers.clustering.cluster_leiden) declares its own leidenalg/python-igraph dep
    "matplotlib",
    "mlflow", # for adalflow
    "numpy",
    "ollama",
    "openai",
    "pandas",
    "pyarrow",
    "plotly",
    "pyalex",
    "pylatexenc",
    "python-igraph", # unused since the legacy curriculum pipeline's Leiden clustering was deleted (Phase-3 Task 10); see leidenalg above
    "pyvis", # for adalflow
    "seaborn",
    "sentence-transformers",
    "transformers",
    "tree-sitter", # for artifacts_scripts/gap_recover rust adapter
    "tree-sitter-rust",
    "umap-learn",
    # Transitive via umap-learn -> pynndescent; pinned because uv's fresh
    # resolution otherwise lands on numba 0.53.1 / llvmlite 0.36.0 (both
    # requires-python <3.10, fail to build on 3.11). Pinned to the versions
    # the old .conda env actually had installed and tested against.
    "numba==0.63.1",
    "llvmlite==0.46.0",
    # For rnojd
    "cdopt",
    "coroica",
    "pymanopt",
    "pyriemann",
    # For scope manager CLI/TUI
    "textual",
    "psutil",
    "typer",
    "tqdm",
    "curriculum",
    # Lazily imported by artifacts_scripts/hdbscan_gap_probe.py:536; the old
    # .conda env had it installed ad hoc but undeclared.
    "fast_hdbscan",
]

[project.scripts]
scope-manager = "scope_manager:main"

[project.optional-dependencies]
dev = [
    "mypy>=1.8.0",
    # Pinned to the .conda baseline: pytest 9 removes the deprecated
    # pytest_ignore_collect(path, config) hookimpl signature that
    # tests/config_manager/conftest.py still uses, turning a deprecation
    # warning into a hard collection error.
    "pytest==8.4.2",
    "pytest-cov",
]

[tool.setuptools]
packages = ["bookgap", "artifacts_scripts", "curriculum_lean"]
py-modules = ["scope_manager"]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests that may incur costs (run with '--integration')",
]
addopts = "-m 'not integration' --ignore=cache"

[tool.uv.sources]
curriculum = { path = "../curriculum", editable = true }