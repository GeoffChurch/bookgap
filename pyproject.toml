[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bookgap"
version = "0.1"
description = "Finding the next textbook to write"
dependencies = [
    "accelerate",
    "adalflow",
    "bitsandbytes",
    "boto3",
    "faiss-cpu",
    "orjson",
    "pysimdjson",
    "graphviz", # for adalflow
    "hydra-core",
    "omegaconf",
    "matplotlib",
    "mlflow", # for adalflow
    "numpy",
    "openai",
    "pandas",
    "pyarrow",
    "plotly",
    "pyalex",
    "pylatexenc",
    "pyvis", # for adalflow
    "seaborn",
    "sentence-transformers",
    "transformers",
    "umap-learn",
    # For rnojd
    "cdopt",
    "coroica",
    "pymanopt",
    "pyriemann",
    # For scope manager CLI/TUI
    "textual",
    "psutil",
    "typer",
]

[project.scripts]
scope-manager = "scope_manager:main"

[project.optional-dependencies]
dev = [
    "mypy>=1.8.0",
    "pytest>=7.0.0",
    "pytest-cov",
]

[tool.setuptools]
packages = ["bookgap", "artifacts_scripts", "curriculum"]
py-modules = ["scope_manager"]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests that may incur costs (run with '--integration')",
]
addopts = "-m 'not integration'"