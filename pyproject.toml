[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bookgap"
version = "0.1"
description = "Finding the next textbook to write"
dependencies = [
    "accelerate",
    "bitsandbytes",
    "faiss-cpu",
    "matplotlib",
    "openai",
    "plotly",
    "pyalex",
    "pylatexenc",
    "sentence-transformers",
    "transformers",
    # For rnojd
    "cdopt",
    "coroica",
    "pymanopt",
    "pyriemann",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.8.0",
    "pytest>=7.0.0",
    "pytest-cov",
]

[tool.setuptools]
packages = ["bookgap"]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests that may incur costs (run with '--integration')",
]
addopts = "-m 'not integration'"